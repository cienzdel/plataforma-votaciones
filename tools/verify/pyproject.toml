[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-verify"
version = "0.1.0"
description = "Independent verifier of the voting platform's published data (spec/)."
license = "EUPL-1.2"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "py_ecc==8.0.0",
  "tzdata==2026.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["pv_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
