#cloud-config
# First boot of a fresh VM. Later boots reuse the same disk: the Oracle VM is only stopped and
# started, and a Hetzner VM is created again from the snapshot left by `down`.
# Installs Docker, age and git; nothing else. SSH accepts keys only.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - age
  - git
ssh_pwauth: false
runcmd:
  - systemctl enable --now docker
  # Oracle's Ubuntu images reject every port but 22 in iptables; open 80 and 443 (no-op elsewhere).
  - |
    if [ -f /etc/iptables/rules.v4 ]; then
      iptables -I INPUT 5 -p tcp --dport 443 -m state --state NEW -j ACCEPT
      iptables -I INPUT 5 -p tcp --dport 80 -m state --state NEW -j ACCEPT
      netfilter-persistent save
    fi
  - mkdir -p /opt/pv
  # Keep the system journal in memory only and small: it never receives voter traffic (containers
  # log nothing), but nothing about the session should outlive the VM's disk either.
  - mkdir -p /etc/systemd/journald.conf.d
  - printf '[Journal]\nStorage=volatile\nRuntimeMaxUse=32M\n' > /etc/systemd/journald.conf.d/pv.conf
  - systemctl restart systemd-journald
