# Builds the web client from this repository and publishes it on GitHub Pages with a build
# provenance attestation (ADR-0017). config.json gives the API addresses; empty when it is off.
# The addresses come only from Up, which runs in the approved "production" environment: a manual
# run publishes the "off" client, and config.ts accepts only the addresses Up derives from the IP.
name: Pages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      api: { type: string, default: "" }
      reception: { type: string, default: "" }
permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
concurrency: pages
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0, pinned: it runs where the client is built and attested
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@pv/web..."
      - run: pnpm --filter @pv/web build
      - name: Write config.json
        env:
          API: ${{ inputs.api }}
          RECEPTION: ${{ inputs.reception }}
          DATA: ${{ vars.PV_PAGES_URL }}
        run: node apps/web/scripts/config.ts apps/web/dist/config.json
      - run: node apps/web/scripts/size.ts
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: "apps/web/dist/**" }
      - uses: actions/upload-pages-artifact@v4
        with: { path: apps/web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
