version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev: { dependency-type: development }
  - package-ecosystem: pip
    directory: /tools/verify
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: weekly }
